name: Test K8TRE Deployment to K3S 
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "dev-*"
  workflow_dispatch:

jobs:
  # pre-commit:
  #   runs-on: ubuntu-24.04
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-python@v6
  #     - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 20 }}

    env:
      ARGOCD_VERSION: v3.3.8
      CLI_ARCH: amd64
      CILIUM_VERSION: 1.19.3

    steps:

      - name: Free up disk space on GitHub runner
        uses: manics/action-free-disk-space@1.0.0
        with:
          desired-space: 40000

      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: dev-requirements.txt

      - name: Install dependencies
        run: |
          pip install -r dev-requirements.txt
          playwright install --with-deps chromium

      - name: Set hostname and domain
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            NETBIRD_HOST="k8tre-${GITHUB_RUN_ID}"
            # NETBIRD_HOST=
            echo "NETBIRD_HOST=$NETBIRD_HOST" >> "$GITHUB_ENV"
            echo "K8TRE_DOMAIN=$NETBIRD_HOST.netbird.cloud" >> "$GITHUB_ENV"
          else
            echo "K8TRE_DOMAIN=dev.k8tre.internal" >> "$GITHUB_ENV"
          fi

      - name: Modify hosts to resolve k8tre.internal URLs
        run: |
          K8TRE_SUBDOMAINS="portal.$K8TRE_DOMAIN jupyter.$K8TRE_DOMAIN guacamole.$K8TRE_DOMAIN keycloak.$K8TRE_DOMAIN cr8tor.$K8TRE_DOMAIN argocd.$K8TRE_DOMAIN gitea.$K8TRE_DOMAIN $K8TRE_DOMAIN"
          NODE_IP=$(hostname -I | awk '{print $1}')
          echo "Mapping subdomains to $NODE_IP and 127.0.0.1:"
          echo "$NODE_IP $K8TRE_SUBDOMAINS" | sudo tee -a /etc/hosts
          echo "127.0.0.1 $K8TRE_SUBDOMAINS" | sudo tee -a /etc/hosts
          cat /etc/hosts

      - name: Setup Netbird
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
        run: |
          curl -fsSL https://pkgs.netbird.io/install.sh | sudo sh
          # Installation script autostarts netbird but this causes problems with
          # registering the host
          sudo systemctl stop netbird

          sudo mkdir -p /etc/netbird
          sudo tee /etc/netbird/config.json > /dev/null <<EOF
          {
            "ManagementURL": "https://api.netbird.io:443",
            "AdminURL": "https://app.netbird.io:443",
            "SetupKey": "$NETBIRD_SETUP_KEY",
            "Hostname": "$NETBIRD_HOST",
            "ServerSSHAllowed": true
          }
          EOF

          sudo systemctl start netbird

          # sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" --hostname "$NETBIRD_HOST" --allow-server-ssh --log-level debug

          for i in $(seq 1 30); do
            if [ -S /var/run/netbird.sock ] && netbird status >/dev/null 2>&1; then
              break
            fi
            sleep 0.5
          done

          NB_FQDN=$(netbird status | sed -n 's/.*FQDN:[[:space:]]*//p')
          if [ "$NB_FQDN" != "$K8TRE_DOMAIN" ]; then
            echo "ERROR: NB_FQDN $NB_FQDN != $K8TRE_DOMAIN"
            exit
          fi
          netbird status

      - name: Install deployment
        run: |
          ./ci/run_codeblocks.py docs/guides/installation.md --tag ci --run

      - name: Wait for K8TRE applications to be Healthy and Synced
        run: ./ci/wait_for_deployment.py

      - name: Run tests (not UI)
        run: |
          python -m pytest -v -s --color=yes -m "not ui"

      - name: Run tests (UI)
        run: |
          python -m pytest -v -s --color=yes -m ui

      - name: Upload screenshot
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots
          path: screenshots/*
          if-no-files-found: ignore

      - name: Collect diagnostics, including on failure
        if: always()
        run: ./ci/collect_diagnostics.sh

      # - name: Setup Netbird
      #   if: always() && github.event_name == 'workflow_dispatch'
      #   env:
      #     NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
      #   run: |
      #     curl -fsSL https://pkgs.netbird.io/install.sh | sudo sh
      #     sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" --hostname "$NETBIRD_HOST" --allow-server-ssh --log-level debug
      #     NB_FQDN=$(netbird status | sed -n 's/.*FQDN:[[:space:]]*//p')
      #     if [ "$NB_FQDN" != "$K8TRE_DOMAIN" ]; then
      #       echo "ERROR: NB_FQDN $NB_FQDN != $K8TRE_DOMAIN"
      #       exit
      #     fi
      #     netbird status

      - name: Sleep for Netbird
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          sleep 30m

  # Set a single status check for the whole workflow, so that we can use it in a
  # branch protection rule
  status-check:
    runs-on: ubuntu-24.04
    needs:
      # - pre-commit
      - test
    if: always()
    steps:
      - name: Get job statuses
        uses: technote-space/workflow-conclusion-action@v3.0.3
        with:
          FALLBACK_CONCLUSION: failure
          STRICT_SUCCESS: true
        # Status is saved in env.WORKFLOW_CONCLUSION

      - name: Status check
        if: env.WORKFLOW_CONCLUSION != 'success'
        run: |
          exit 1