apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cr8tor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    repoURL: https://github.com/manics-ai/k8tre.git
    targetRevision: antigravity
    path: apps/cr8tor/envs/dev
    plugin:
      name: kustomize-with-envsubst-v1.0
      env:
        - name: ENVIRONMENT
          value: dev
        - name: DOMAIN
          value: 192.168.0.66.nip.io
  destination:
    server: https://kubernetes.default.svc
    namespace: cr8tor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
